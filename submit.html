<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi tin tức | VALORANT NEWS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
    <style>
        .navbar { background: rgba(6,8,15,0.9) !important; backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.07); padding: 0; position: sticky; top: 0; z-index: 100; }
        .navbar-brand { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.4rem; letter-spacing: 0.12em; color: #fff !important; padding: 16px 0; }
        .navbar-brand span { color: #ff4655; }
        .nav-link { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; color: #64748b !important; padding: 20px 16px !important; position: relative; transition: color 0.2s; }
        .nav-link::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 0; height: 2px; background: #ff4655; transition: width 0.3s; }
        .nav-link:hover { color: #fff !important; }
        .nav-link:hover::after { width: 60%; }
        .nav-link.active { color: #fff !important; }
        .nav-link.active::after { width: 60%; }

        .submit-page {
            background: #06080f;
            min-height: 100vh;
            position: relative;
        }
        .submit-page::before {
            content: '';
            position: fixed;
            top: -20%; left: 50%; transform: translateX(-50%);
            width: 900px; height: 500px;
            background: radial-gradient(ellipse, rgba(255,70,85,0.07) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        .submit-wrapper {
            max-width: 820px;
            margin: 0 auto;
            padding: 60px 0 80px;
            position: relative;
            z-index: 1;
        }

        .submit-card {
            background: rgba(13,18,30,0.95);
            border: 1px solid rgba(255,70,85,0.2);
            border-top: 2px solid #ff4655;
            border-radius: 4px;
            padding: 48px;
            box-shadow: 0 0 60px rgba(255,70,85,0.06), 0 30px 80px rgba(0,0,0,0.8);
        }

        .submit-header {
            margin-bottom: 40px;
        }

        .submit-tag {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #ff4655;
            background: rgba(255,70,85,0.1);
            border: 1px solid rgba(255,70,85,0.25);
            padding: 4px 12px;
            border-radius: 2px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .submit-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #fff;
            line-height: 1;
        }

        .submit-desc {
            margin-top: 12px;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 300;
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.6;
        }

        .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 32px 0; }

        .form-row { margin-bottom: 24px; }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: #ff4655;
            color: #fff;
            border: none;
            border-radius: 2px;
            padding: 14px 32px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #e03344;
            box-shadow: 0 0 30px rgba(255,70,85,0.4);
            transform: translateY(-2px);
        }

        .category-select {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .cat-btn {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 8px 18px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn:hover, .cat-btn.active {
            border-color: #ff4655;
            color: #ff4655;
            background: rgba(255,70,85,0.08);
        }
    </style>
</head>
<body class="submit-page">

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="main.html">VALORANT<span> NEWS</span></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="main.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link active" href="submit.html">Gửi tin tức</a></li>
                    <li class="nav-item"><a class="nav-link" href="dangki.html">Tài khoản</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="submit-wrapper">
            <div class="submit-card">
                <div class="submit-header">
                    <span class="submit-tag">Đóng góp nội dung</span>
                    <div class="submit-title">Gửi tin tức mới</div>
                    <p class="submit-desc">Chia sẻ tin tức, guide hoặc lore Valorant với cộng đồng. Bài viết sẽ được kiểm duyệt trước khi đăng.</p>
                </div>

                <div class="divider"></div>

                <form onsubmit="return handleSubmit(event)">
                    <div class="form-row">
                        <label class="form-label">Tiêu đề bài viết</label>
                        <input type="text" class="form-control" placeholder="Nhập tiêu đề bài viết..." required>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Danh mục</label>
                        <div class="category-select">
                            <button type="button" class="cat-btn active" onclick="selectCat(this)">📋 Patch Notes</button>
                            <button type="button" class="cat-btn" onclick="selectCat(this)">🗺️ Maps</button>
                            <button type="button" class="cat-btn" onclick="selectCat(this)">👁️ Agents / Lore</button>
                            <button type="button" class="cat-btn" onclick="selectCat(this)">🎮 Guide</button>
                            <button type="button" class="cat-btn" onclick="selectCat(this)">🏆 Esports</button>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Hình ảnh đại diện</label>
                        <input type="file" class="form-control" accept="image/*">
                    </div>

                    <div class="form-row">
                        <label class="form-label">Nội dung bài viết</label>
                        <textarea class="form-control" rows="8" placeholder="Viết nội dung tại đây..." required></textarea>
                    </div>

                    <div class="divider"></div>

                    <button type="submit" class="btn-submit">Gửi bài viết →</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function selectCat(el) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function handleSubmit(e) {
            e.preventDefault();
            alert('Bài viết đã được gửi! Chúng tôi sẽ kiểm duyệt và đăng sớm nhé 🎮');
        }
    </script>
</body>
</html>
