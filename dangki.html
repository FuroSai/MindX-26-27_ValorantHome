<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | VALORANT NEWS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="dangki.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-brand">
            <div class="logo">VALORANT<span> NEWS</span></div>
            <div class="sub">Tạo tài khoản mới</div>
        </div>
        <div class="divider"></div>
        <h3 class="auth-title">Đăng ký</h3>

        <div id="alertMsg" class="alert-msg"></div>

        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">Tên người dùng</label>
                <input type="text" class="form-control" id="username" placeholder="Nhập username..." required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Nhập email..." required>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" placeholder="•••••••• (tối thiểu 6 ký tự)"
                    required>
            </div>
            <button type="submit" class="btn-auth">Tạo tài khoản →</button>
        </form>

        <div class="auth-switch">
            Đã có tài khoản? <a href="dangnhap.html">Đăng nhập</a>
        </div>
    </div>

    <!-- Load module xác thực -->
    <script type="module" src="auth.js"></script>
    <script type="module" src="dangki.js"></script>
</body>

</html>
