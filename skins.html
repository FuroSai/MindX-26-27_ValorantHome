<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKIN SÚNG - VALORANT NEWS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Noto+Sans+JP:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .skins-hero {
            padding: 60px 0 20px;
            text-align: center;
        }

        .skins-hero .hero-tag {
            display: inline-block;
            margin-bottom: 14px;
        }

        .skins-hero h1 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 2.6rem;
            color: #fff;
        }

        .skins-hero p {
            max-width: 640px;
            margin: 10px auto 0;
            color: rgba(255, 255, 255, 0.6);
        }

        .weapon-block {
            margin-top: 50px;
        }

        .weapon-block-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .weapon-block-header h3 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: #fff;
            margin: 0;
            font-size: 1.5rem;
        }

        .weapon-block-header span {
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        .skin-card {
            background: rgba(20, 22, 28, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .skin-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 70, 85, 0.4);
            box-shadow: 0 10px 24px rgba(255, 70, 85, 0.12);
        }

        .skin-img-wrap {
            background: radial-gradient(circle at 50% 40%, rgba(255, 70, 85, 0.10), rgba(0, 0, 0, 0.35) 70%);
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
        }

        .skin-img-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5));
        }

        .skin-body {
            padding: 14px 16px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .skin-name {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.15;
        }

        .skin-tier {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .skin-tier::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .skin-tier.tier-exclusive {
            color: #facc15;
            background: rgba(250, 204, 21, 0.08);
            border-color: rgba(250, 204, 21, 0.35);
        }

        .skin-tier.tier-exclusive::before {
            background: #facc15;
        }

        .skin-tier.tier-deluxe {
            color: #c084fc;
            background: rgba(192, 132, 252, 0.08);
            border-color: rgba(192, 132, 252, 0.35);
        }

        .skin-tier.tier-deluxe::before {
            background: #c084fc;
        }

        .skins-source {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin: 60px 0 30px;
        }

        .skins-source a {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ── Video Modal ── */
        .skin-card.has-video {
            cursor: pointer;
        }

        .skin-card.has-video .skin-img-wrap {
            position: relative;
        }

        .skin-card.has-video .skin-img-wrap::after {
            content: "▶";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0);
            opacity: 0;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        .skin-card.has-video:hover .skin-img-wrap::after {
            opacity: 1;
            background: rgba(0, 0, 0, 0.35);
        }

        .video-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .video-modal-overlay.open {
            display: flex;
        }

        .video-modal-box {
            width: 100%;
            max-width: 860px;
            background: #14161c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        .video-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .video-modal-head span {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: #fff;
            font-size: 1.1rem;
        }

        .video-modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            padding: 4px 8px;
        }

        .video-modal-close:hover {
            color: #ff4655;
        }

        .video-modal-body {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-modal-body iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>
    <div class="ambient"></div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="main.html">VALORANT<span> NEWS</span></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center gap-1" id="navUserArea">
                    <li class="nav-item">
                        <a class="nav-link" href="main.html">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="skins.html">Skin Súng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="submit.html">Gửi tin tức</a>
                    </li>
                    <!-- Vùng user/tài khoản được render động bởi JS -->
                    <li class="nav-item ms-2" id="navUserAuthArea"></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <div class="container skins-hero" id="skinsHero">
        <!-- Được render bởi JS -->
    </div>

    <!-- NỘI DUNG SKIN -->
    <div class="container" id="skinsContent">
        <!-- Được render bởi JS -->
    </div>

    <!-- MODAL VIDEO -->
    <div class="video-modal-overlay" id="videoModalOverlay">
        <div class="video-modal-box">
            <div class="video-modal-head">
                <span id="videoModalTitle">Giới thiệu skin</span>
                <button class="video-modal-close" id="videoModalClose" aria-label="Đóng">&times;</button>
            </div>
            <div class="video-modal-body">
                <iframe id="videoModalFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <div class="footer-brand">VALORANT<span> NEWS</span></div>
                    <div class="footer-text">Trang tin tức không chính thức về Valorant. Fan-made.</div>
                </div>
                <div class="d-flex gap-3">
                    <a href="main.html" class="btn-read" style="font-size:0.75rem;">Trang chủ</a>
                    <a href="submit.html" class="btn-read" style="font-size:0.75rem;">Gửi tin</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts (type="module" bắt buộc vì Auth dùng Firebase ES modules) -->
    <script type="module">
        import Auth from './auth.js';

        // ── Navbar: hiển thị user hay nút tài khoản ──
        const navUserAuthArea = document.getElementById('navUserAuthArea');

        Auth.onAuthChange((user) => {
            if (user) {
                navUserAuthArea.innerHTML = `
                    <span class="user-chip"><span class="user-dot"></span>${user.username || user.email}</span>
                    <button class="btn-logout ms-2" id="btnLogout">Đăng xuất</button>
                `;
                document.getElementById('btnLogout').addEventListener('click', doLogout);
            } else {
                navUserAuthArea.innerHTML = `
                    <a class="btn-nav-user" href="dangnhap.html">Tài khoản</a>
                `;
            }
        });

        async function doLogout() {
            await Auth.logout();
            location.reload();
        }

        // ── Render nội dung từ skins.json ──
        fetch('skins.json')
            .then(res => {
                if (!res.ok) throw new Error('Không tải được skins.json');
                return res.json();
            })
            .then(data => {
                renderHero(data);
                renderWeapons(data.weapons);
                renderSource(data);
            })
            .catch(err => {
                console.error('Lỗi tải dữ liệu:', err);
                document.getElementById('skinsContent').innerHTML =
                    '<p style="color:#ff4655; padding: 40px 0;">Không thể tải dữ liệu skin.</p>';
            });

        function renderHero(data) {
            document.getElementById('skinsHero').innerHTML = `
            <div class="hero-tag">${data.pageTag}</div>
            <h1>${data.pageTitle}</h1>
            <p>${data.pageSubtitle}</p>
        `;
        }

        function renderWeapons(weapons) {
            const container = document.getElementById('skinsContent');
            container.innerHTML = weapons.map(w => `
            <div class="weapon-block">
                <div class="weapon-block-header">
                    <h3>${w.weaponName}</h3>
                    <span>${w.weaponTag}</span>
                </div>
                <div class="row g-4">
                    ${w.skins.map((s, i) => `
                    <div class="col-6 col-md-4 col-lg-3 fade-up" style="animation-delay:${i * 0.08 + 0.1}s">
                        <div class="skin-card ${s.video ? 'has-video' : ''}" ${s.video ? `data-video="${s.video}" data-name="${s.name}"` : ''}>
                            <div class="skin-img-wrap">
                                <img src="${s.image}" alt="${s.name}" loading="lazy">
                            </div>
                            <div class="skin-body">
                                <div class="skin-name">${s.name}</div>
                                <span class="skin-tier ${s.tierClass}">${s.tier} · ${s.tierColor}</span>
                            </div>
                        </div>
                    </div>
                    `).join('')}
                </div>
            </div>
        `).join('');

            // Gắn sự kiện click cho các thẻ có video
            container.querySelectorAll('.skin-card.has-video').forEach(card => {
                card.addEventListener('click', () => {
                    openVideoModal(card.dataset.video, card.dataset.name);
                });
            });
        }

        // ── Modal video ──
        const videoOverlay = document.getElementById('videoModalOverlay');
        const videoFrame = document.getElementById('videoModalFrame');
        const videoTitle = document.getElementById('videoModalTitle');

        function extractYoutubeId(url) {
            // Hỗ trợ nhiều dạng link: watch?v=, youtu.be/, embed/
            const patterns = [
                /(?:youtube\.com\/watch\?v=)([^&]+)/,
                /(?:youtu\.be\/)([^?]+)/,
                /(?:youtube\.com\/embed\/)([^?]+)/
            ];
            for (const p of patterns) {
                const match = url.match(p);
                if (match) return match[1];
            }
            return null;
        }

        function openVideoModal(url, name) {
            const videoId = extractYoutubeId(url);
            if (!videoId) {
                console.error('Không đọc được ID video từ link:', url);
                return;
            }
            videoTitle.textContent = name || 'Giới thiệu skin';
            videoFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            videoOverlay.classList.add('open');
        }

        function closeVideoModal() {
            videoOverlay.classList.remove('open');
            videoFrame.src = ''; // dừng video khi đóng
        }

        document.getElementById('videoModalClose').addEventListener('click', closeVideoModal);
        videoOverlay.addEventListener('click', (e) => {
            if (e.target === videoOverlay) closeVideoModal(); // click ra ngoài box thì đóng
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVideoModal();
        });

        function renderSource(data) {
            const links = data.sources.map(s => `<a href="${s.link}" target="_blank" rel="noopener">${s.name}</a>`).join(' · ');
            document.getElementById('skinsContent').innerHTML += `
            <div class="skins-source">${data.sourceLabel}: ${links}</div>
        `;
        }
    </script>
</body>

</html>
