<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKIN SÚNG - VALORANT NEWS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Noto+Sans+JP:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .skins-hero {
            padding: 60px 0 20px;
            text-align: center;
        }

        .skins-hero .hero-tag {
            display: inline-block;
            margin-bottom: 14px;
        }

        .skins-hero h1 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 2.6rem;
            color: #fff;
        }

        .skins-hero p {
            max-width: 640px;
            margin: 10px auto 0;
            color: rgba(255, 255, 255, 0.6);
        }

        .weapon-block {
            margin-top: 50px;
        }

        .weapon-block-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .weapon-block-header h3 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: #fff;
            margin: 0;
            font-size: 1.5rem;
        }

        .weapon-block-header span {
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        .skin-card {
            background: rgba(20, 22, 28, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .skin-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 70, 85, 0.4);
            box-shadow: 0 10px 24px rgba(255, 70, 85, 0.12);
        }

        .skin-img-wrap {
            background: radial-gradient(circle at 50% 40%, rgba(255, 70, 85, 0.10), rgba(0, 0, 0, 0.35) 70%);
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
        }

        .skin-img-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5));
        }

        .skin-body {
            padding: 14px 16px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .skin-name {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.15;
        }

        .skin-tier {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .skin-tier::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .skin-tier.tier-exclusive {
            color: #facc15;
            background: rgba(250, 204, 21, 0.08);
            border-color: rgba(250, 204, 21, 0.35);
        }

        .skin-tier.tier-exclusive::before {
            background: #facc15;
        }

        .skin-tier.tier-deluxe {
            color: #c084fc;
            background: rgba(192, 132, 252, 0.08);
            border-color: rgba(192, 132, 252, 0.35);
        }

        .skin-tier.tier-deluxe::before {
            background: #c084fc;
        }

        .skins-source {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin: 60px 0 30px;
        }

        .skins-source a {
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body>
    <div class="ambient"></div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="main.html">VALORANT<span> NEWS</span></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center gap-1" id="navUserArea">
                    <li class="nav-item">
                        <a class="nav-link" href="main.html">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="skins.html">Skin Súng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="submit.html">Gửi tin tức</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <div class="container skins-hero" id="skinsHero">
        <!-- Được render bởi JS -->
    </div>

    <!-- NỘI DUNG SKIN -->
    <div class="container" id="skinsContent">
        <!-- Được render bởi JS -->
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <div class="footer-brand">VALORANT<span> NEWS</span></div>
                    <div class="footer-text">Trang tin tức không chính thức về Valorant. Fan-made.</div>
                </div>
                <div class="d-flex gap-3">
                    <a href="main.html" class="btn-read" style="font-size:0.75rem;">Trang chủ</a>
                    <a href="submit.html" class="btn-read" style="font-size:0.75rem;">Gửi tin</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="auth.js"></script>
    <script>
        // ── Navbar: hiển thị user hay nút tài khoản ──
        const navUserArea = document.getElementById('navUserArea');
        const currentUser = Auth.getCurrentUser();

        if (currentUser) {
            navUserArea.innerHTML += `
            <li class="nav-item">
                <span class="user-chip"><span class="user-dot"></span>${currentUser}</span>
            </li>
            <li class="nav-item ms-2">
                <button class="btn-logout" onclick="doLogout()">Đăng xuất</button>
            </li>
        `;
        } else {
            navUserArea.innerHTML += `
            <li class="nav-item ms-2">
                <a class="btn-nav-user" href="dangnhap.html">Tài khoản</a>
            </li>
        `;
        }

        function doLogout() {
            Auth.logout();
            location.reload();
        }

        // ── Render nội dung từ skins.json ──
        fetch('skins.json')
            .then(res => {
                if (!res.ok) throw new Error('Không tải được skins.json');
                return res.json();
            })
            .then(data => {
                renderHero(data);
                renderWeapons(data.weapons);
                renderSource(data);
            })
            .catch(err => {
                console.error('Lỗi tải dữ liệu:', err);
                document.getElementById('skinsContent').innerHTML =
                    '<p style="color:#ff4655; padding: 40px 0;">Không thể tải dữ liệu skin.</p>';
            });

        function renderHero(data) {
            document.getElementById('skinsHero').innerHTML = `
            <div class="hero-tag">${data.pageTag}</div>
            <h1>${data.pageTitle}</h1>
            <p>${data.pageSubtitle}</p>
        `;
        }

        function renderWeapons(weapons) {
            const container = document.getElementById('skinsContent');
            container.innerHTML = weapons.map(w => `
            <div class="weapon-block">
                <div class="weapon-block-header">
                    <h3>${w.weaponName}</h3>
                    <span>${w.weaponTag}</span>
                </div>
                <div class="row g-4">
                    ${w.skins.map((s, i) => `
                    <div class="col-6 col-md-4 col-lg-3 fade-up" style="animation-delay:${i * 0.08 + 0.1}s">
                        <div class="skin-card">
                            <div class="skin-img-wrap">
                                <img src="${s.image}" alt="${s.name}" loading="lazy">
                            </div>
                            <div class="skin-body">
                                <div class="skin-name">${s.name}</div>
                                <span class="skin-tier ${s.tierClass}">${s.tier} · ${s.tierColor}</span>
                            </div>
                        </div>
                    </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
        }

        function renderSource(data) {
            const links = data.sources.map(s => `<a href="${s.link}" target="_blank" rel="noopener">${s.name}</a>`).join(' · ');
            document.getElementById('skinsContent').innerHTML += `
            <div class="skins-source">${data.sourceLabel}: ${links}</div>
        `;
        }
    </script>
</body>

</html>
