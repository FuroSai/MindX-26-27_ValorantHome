<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORANT NEWS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Noto+Sans+JP:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="ambient"></div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="main.html">VALORANT<span> NEWS</span></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center gap-1" id="navUserArea">
                    <li class="nav-item">
                        <a class="nav-link active" href="main.html">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="skins.html">Skin Súng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="submit.html">Gửi tin tức</a>
                    </li>
                    <!-- Vùng user/tài khoản được render động bởi JS, xem #navUserAuthArea -->
                    <li class="nav-item ms-2" id="navUserAuthArea"></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- TICKER (render từ JSON) -->
    <div class="news-ticker">
        <div class="ticker-inner" id="tickerInner">
            <!-- Được render bởi JS -->
        </div>
    </div>

    <!-- HERO (render từ JSON) -->
    <div class="hero" id="heroSection">
        <div class="hero-bg"></div>
        <div class="hero-content" id="heroContent">
            <!-- Được render bởi JS -->
        </div>
    </div>

    <!-- NỘI DUNG CHÍNH (render từ JSON) -->
    <div class="container" id="mainContent">
        <!-- Được render bởi JS -->
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <div class="footer-brand">VALORANT<span> NEWS</span></div>
                    <div class="footer-text">Trang tin tức không chính thức về Valorant. Fan-made.</div>
                </div>
                <div class="d-flex gap-3">
                    <a href="main.html" class="btn-read" style="font-size:0.75rem;">Trang chủ</a>
                    <a href="submit.html" class="btn-read" style="font-size:0.75rem;">Gửi tin</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts (type="module" bắt buộc vì Auth dùng Firebase ES modules) -->
    <script type="module">
        import Auth from './auth.js';

        // ── Navbar: hiển thị user hay nút tài khoản ──
        // Firebase load trạng thái đăng nhập bất đồng bộ, nên phải dùng
        // onAuthChange() để lắng nghe thay vì đọc Auth.getCurrentUser() ngay lập tức.
        const navUserAuthArea = document.getElementById('navUserAuthArea');

        Auth.onAuthChange((user) => {
            if (user) {
                navUserAuthArea.innerHTML = `
                    <span class="user-chip"><span class="user-dot"></span>${user.username || user.email}</span>
                    <button class="btn-logout ms-2" id="btnLogout">Đăng xuất</button>
                `;
                document.getElementById('btnLogout').addEventListener('click', doLogout);
            } else {
                navUserAuthArea.innerHTML = `
                    <a class="btn-nav-user" href="dangnhap.html">Tài khoản</a>
                `;
            }
        });

        async function doLogout() {
            await Auth.logout();
            location.reload();
        }

        // ── Render nội dung từ news.json ──
        fetch('news.json')
            .then(res => {
                if (!res.ok) throw new Error('Không tải được news.json');
                return res.json();
            })
            .then(data => {
                renderTicker(data.ticker);
                renderHero(data.hero);
                renderSections(data.sections);
            })
            .catch(err => {
                console.error('Lỗi tải dữ liệu:', err);
                document.getElementById('mainContent').innerHTML =
                    '<p style="color:#ff4655; padding: 40px 0;">Không thể tải dữ liệu tin tức.</p>';
            });

        function renderTicker(items) {
            // Nhân đôi để ticker chạy liên tục
            const all = [...items, ...items];
            document.getElementById('tickerInner').innerHTML =
                all.map(t => `<span class="ticker-item">${t}</span>`).join('');
        }

        function renderHero(h) {
            document.getElementById('heroContent').innerHTML = `
                <div class="hero-tag">${h.tag}</div>
                <h1>${h.title}<br><em>${h.titleAccent}</em></h1>
                <p>${h.description}</p>
                <div class="d-flex align-items-center gap-3">
                    <a href="${h.btnLink}" class="btn-nav-user">${h.btnText}</a>
                    <span class="version-badge">◆ ${h.version}</span>
                </div>
            `;
        }

        function renderSections(sections) {
            const container = document.getElementById('mainContent');
            container.innerHTML = sections.map(section => `
                <div class="section-header">
                    <div class="line"></div>
                    <h2>${section.icon} ${section.title}</h2>
                    <span class="section-tag">${section.tag}</span>
                    <div class="line" style="background: linear-gradient(to left, rgba(255,70,85,0.4), transparent);"></div>
                </div>
                <div class="row g-4">
                    ${section.articles.map((a, i) => `
                    <div class="col-md-6 fade-up" style="animation-delay:${i * 0.1 + 0.1}s">
                        <div class="news-card">
                            <div class="card-img-wrap">
                                <span class="card-category ${a.categoryClass}">${a.category}</span>
                                <img src="${a.image}" alt="${a.imageAlt}">
                            </div>
                            <div class="card-body-custom">
                                <div class="card-title-custom">${a.title}</div>
                                <p class="card-text-custom">${a.summary}</p>
                                <div class="card-footer-custom">
                                    <a href="${a.link}" class="btn-read">Xem chi tiết</a>
                                    <span class="version-badge" style="font-size:0.6rem; padding: 2px 8px; ${a.badgeColor}">${a.badge}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    `).join('')}
                </div>
            `).join('');
        }
    </script>
</body>

</html>
